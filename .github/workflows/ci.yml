name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace
          POSTGRES_DB: ace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d ace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ace:ace@localhost:5432/ace
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Create test database
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          engine = create_engine('postgresql+psycopg://ace:ace@localhost:5432/postgres', isolation_level='AUTOCOMMIT')
          with engine.connect() as conn:
              conn.execute(text('CREATE DATABASE ace_test'))
          "
      - name: Apply migrations to test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://ace:ace@localhost:5432/ace_test
      - name: Test
        run: uv run pytest
