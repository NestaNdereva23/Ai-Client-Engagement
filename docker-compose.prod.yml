
services:
  ace-migrate:
    image: ace-app:latest
    build:
      context: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env.prod
    depends_on:
      ace-db:
        condition: service_healthy
    networks: [backend]

  ace:
    image: ace-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      ace-db:
        condition: service_healthy
      ace-migrate:
        condition: service_completed_successfully
    networks: [backend]

  ace-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes:
      - ace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - ace
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  ace_pgdata:
  certbot_www:
  certbot_certs:

networks:
  backend:
