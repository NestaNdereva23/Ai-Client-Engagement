services:
  ace-migrate:
    image: ace-app:latest
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env.prod
    depends_on:
      ace-db:
        condition: service_healthy
    networks: [backend]

  ace:
    image: ace-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ace-db:
        condition: service_healthy
      ace-migrate:
        condition: service_completed_successfully
    networks: [backend]

  ace-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    volumes:
      - ace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

volumes:
  ace_pgdata:

networks:
  backend:
