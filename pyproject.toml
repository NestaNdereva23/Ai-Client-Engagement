[project]
name = "ai-client-engagement"
version = "0.1.0"
description = "AI Client Engagement (ACE): AI-drafted, human-reviewed personalized client outreach. v1: dormant-client email win-back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "anthropic>=0.120.0",
    "langgraph>=1.2.9",
    "langfuse>=4.14,<5",
    "fastapi-admin>=1.0.4",
    "sqladmin>=0.31.0",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.13.0",
]

# This is an application, not a distributable library: uv manages the
# environment and dependencies but does not build/install the project itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]

extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/inactive/tests", "scripts/active/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
